<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>EX5 横スクロール軽量計測</title>
<style>
html,body{margin:0;width:100%;height:100%;font:14px sans-serif;background:#fff}iframe{position:fixed;inset:0;border:0;width:100%;height:100%}
#tools{position:fixed;bottom:0;left:0;right:0;z-index:999;background:#13253a;color:white;padding:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}button,select{min-height:36px}#status{font-size:12px}#tools.measuring{opacity:.8}#tools.measuring select{display:none}
</style>
<iframe id="app" src="../index.html" title="計測対象アプリ" allow="autoplay; microphone; screen-wake-lock"></iframe>
<div id="tools"><select id="mode" aria-label="計測条件"><option value="automatic">自動スクロール</option><option value="manual">指でスクロール</option></select><button id="start">計測を準備</button><button id="stop" disabled>終了</button><button id="save" disabled>ログ保存</button><span id="status">EX5を開く → 計測を準備 → 練習開始（60 BPM）</span></div>
<script type="module" src="scroll-performance.js"></script></html>
