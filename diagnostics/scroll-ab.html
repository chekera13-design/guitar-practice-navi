<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EX5 自動スクロール A/B/E/F診断（dev専用）</title>
    <style>
        html, body { margin: 0; width: 100%; height: 100%; font: 14px system-ui, sans-serif; }
        #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
        #panel { position: fixed; z-index: 10000; right: 8px; top: 8px; max-width: min(640px, calc(100% - 36px));
            padding: 10px; background: #101c2e; color: #fff; border: 1px solid #94a3b8; border-radius: 8px; }
        summary { cursor: pointer; min-height: 24px; }
        #status { display: block; margin: 6px 0 0; }
        button, select { min-height: 36px; margin: 3px; font: inherit; }
        button:disabled { opacity: .6; }
        #output { display: block; width: min(580px, 85vw); height: 100px; margin-top: 8px; }
        #output[hidden] { display: none; }
        p { margin: 6px 0; }
    </style>
</head>
<body>
    <iframe id="app" title="通常アプリ（A/B診断対象）" src="../index.html"></iframe>
    <details id="panel" open>
        <summary>EX5・60 BPM / A・B・E・F（dev診断・第3段階）<span id="status" role="status">アプリ読み込み中…</span></summary>
        <label>条件 <select id="condition"><option value="A">A：通常</option><option value="B">B：装飾なし</option><option value="E">E：背景ぼかしのみ無効</option><option value="F">F：メトロノーム装飾のみ無効</option></select></label>
        <button id="arm" disabled>次の練習を計測</button>
        <button id="cancel" disabled>診断を解除</button>
        <p>① 基礎編EX5を開き、60 BPM・1回・横型にする。② 計測を準備 → アプリの「練習」。</p>
        <p>カウントイン後3～33秒を測定。完了表示後は練習を停止。A → E → A → F → A → B → Aの順に7回測定してください。</p>
        <p>測定中は画面の向き・ウィンドウ・倍率・DevTools・タブを変えないでください。</p>
        <p>準備するとパネルを折りたたみます。状態表示は残ります。次の条件選択・結果の出力は見出しを押して開きます。</p>
        <button id="copy" disabled>全結果をコピー</button><button id="save" disabled>JSONを保存</button>
        <button id="show" disabled>結果テキスト</button>
        <textarea id="output" aria-label="診断結果JSON（コピー用）" readonly hidden></textarea>
    </details>
    <script type="module" src="scroll-ab.js"></script>
</body>
</html>
